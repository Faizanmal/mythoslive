# MythosLive API vhost for mythos-api.faizanmalik.me
# On the VM:
#   1. sudo cp deploy/nginx/mythos-api.faizanmalik.me.conf /etc/nginx/sites-available/
#   2. sudo ln -sf /etc/nginx/sites-available/mythos-api.faizanmalik.me.conf /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d mythos-api.faizanmalik.me
#   4. sudo nginx -t && sudo systemctl reload nginx
# Upstream is the production Compose loopback publish (API_HOST_PORT=8001).

server {
    listen 80;
    listen [::]:80;
    server_name mythos-api.faizanmalik.me;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
