x-backend-image: &backend-image
  image: ${MYTHOSLIVE_BACKEND_IMAGE:-mythoslive-backend:local}
  build:
    context: ..
    dockerfile: backend/Dockerfile.production

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  BUILD_VERSION: ${BUILD_VERSION:-unknown}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the exact Netlify custom origin}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-}
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  TWITCH_BROADCASTER_REDIRECT_URI: ${TWITCH_BROADCASTER_REDIRECT_URI:?set the registered broadcaster callback}
  TWITCH_BOT_REDIRECT_URI: ${TWITCH_BOT_REDIRECT_URI:?set the registered bot callback}
  TWITCH_EVENTSUB_URL: ${TWITCH_EVENTSUB_URL:-wss://eventsub.wss.twitch.tv/ws}
  TWITCH_EVENTSUB_KEEPALIVE_TIMEOUT: ${TWITCH_EVENTSUB_KEEPALIVE_TIMEOUT:-30}
  EVENTSUB_MAX_RETRIES: ${EVENTSUB_MAX_RETRIES:-10}
  SIM_WORLD_ID: ${SIM_WORLD_ID:-6c9f5a98-8f43-5bd5-a263-239ea8b494fc}
  CHAT_OUTBOX_MAX_SIZE: ${CHAT_OUTBOX_MAX_SIZE:-200}
  CHAT_OUTBOX_BATCH_MAX_SIZE: ${CHAT_OUTBOX_BATCH_MAX_SIZE:-20}
  CHAT_GLOBAL_MESSAGES_PER_30_SECONDS: ${CHAT_GLOBAL_MESSAGES_PER_30_SECONDS:-20}
  CHAT_CHANNEL_INTERVAL_SECONDS: ${CHAT_CHANNEL_INTERVAL_SECONDS:-1.0}
  CHAT_MAX_MESSAGE_LENGTH: ${CHAT_MAX_MESSAGE_LENGTH:-500}
  COMMAND_MAX_INPUT_LENGTH: ${COMMAND_MAX_INPUT_LENGTH:-500}
  COMMAND_GLOBAL_PER_SECOND: ${COMMAND_GLOBAL_PER_SECOND:-100}
  COMMAND_USER_COOLDOWN_SECONDS: ${COMMAND_USER_COOLDOWN_SECONDS:-0.5}
  AI_API_BASE_URL: ${AI_API_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_DIRECTOR_MODEL: ${AI_DIRECTOR_MODEL:-}
  AI_FAST_MODEL: ${AI_FAST_MODEL:-}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
  AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-4.0}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
  AI_CIRCUIT_FAILURE_THRESHOLD: ${AI_CIRCUIT_FAILURE_THRESHOLD:-3}
  AI_CIRCUIT_RESET_SECONDS: ${AI_CIRCUIT_RESET_SECONDS:-30}
  AI_SESSION_TOKEN_BUDGET: ${AI_SESSION_TOKEN_BUDGET:-20000}
  AI_SESSION_COST_BUDGET_USD: ${AI_SESSION_COST_BUDGET_USD:-1.0}
  AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-0.0}
  AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-0.0}
  AI_TONE: ${AI_TONE:-heroic}
  AI_FAMILY_FRIENDLY: ${AI_FAMILY_FRIENDLY:-true}
  AI_BANNED_TOPICS: ${AI_BANNED_TOPICS:-[]}
  AI_APPROVAL_MODE: ${AI_APPROVAL_MODE:-required}
  QUILL_USER_COOLDOWN_SECONDS: ${QUILL_USER_COOLDOWN_SECONDS:-30}
  QUILL_GLOBAL_MESSAGES_PER_MINUTE: ${QUILL_GLOBAL_MESSAGES_PER_MINUTE:-6}
  MEMORY_CONTEXT_LIMIT: ${MEMORY_CONTEXT_LIMIT:-6}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: &rotating-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *rotating-logs

  migrate:
    <<: *backend-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    networks: [private]
    depends_on:
      db:
        condition: service_healthy
    logging: *rotating-logs

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    environment: *backend-environment
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8001}:8000"
    networks: [app, private]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *rotating-logs

networks:
  app:
  private:
    internal: true

volumes:
  postgres-data:
  redis-data:
