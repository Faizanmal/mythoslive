[build]
  base = "frontend"
  # Next 16 defaults to Turbopack; Netlify's builder often only loads WASM SWC,
  # and Turbopack requires native bindings. Force Webpack for this host.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Intentionally public Next.js browser config; must appear in the client bundle.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_API_URL"
